<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte à rebours</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: 'Lato', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrapper {
    background: #f7f0e3;
    border: 1px solid #7b9cb8;
    border-radius: 4px;
    padding: 1.4rem 2rem 1.2rem;
    text-align: center;
    position: relative;
    width: fit-content;
  }

  .wrapper::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 0.5px solid #a89bbf;
    border-radius: 2px;
    pointer-events: none;
  }

  .label-top {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: #7b6fa0;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .units {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 64px;
  }

  .number {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 48px;
    line-height: 1;
    color: #1e3a5f;
    letter-spacing: -0.02em;
  }

  .unit-label {
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: #7b6fa0;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .separator {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 300;
    color: #a89bbf;
    line-height: 1;
    padding: 0 3px;
    align-self: flex-start;
    margin-top: 6px;
    flex-shrink: 0;
  }

  .divider {
    width: 40px;
    height: 0.5px;
    background: #7b9cb8;
    margin: 1rem auto 0.8rem;
  }

  .date-line {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: #1e3a5f;
    letter-spacing: 0.05em;
  }

  .finished {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: #1e3a5f;
    padding: 0.5rem 0;
  }
</style>
</head>
<body>
<div class="wrapper">
  <p class="label-top">Plus que</p>
  <div class="units" id="units">
    <div class="unit">
      <span class="number" id="days">--</span>
      <span class="unit-label">jours</span>
    </div>
    <span class="separator">·</span>
    <div class="unit">
      <span class="number" id="hours">--</span>
      <span class="unit-label">heures</span>
    </div>
    <span class="separator">·</span>
    <div class="unit">
      <span class="number" id="minutes">--</span>
      <span class="unit-label">minutes</span>
    </div>
    <span class="separator">·</span>
    <div class="unit">
      <span class="number" id="seconds">--</span>
      <span class="unit-label">secondes</span>
    </div>
  </div>
  <div class="divider"></div>
  <p class="date-line">5 juin 2027</p>
</div>

<script>
  const target = new Date('2027-06-05T14:00:00');

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
      document.getElementById('units').innerHTML = '<p class="finished">C\'est aujourd\'hui ✦</p>';
      return;
    }

    const days    = Math.floor(diff / 86400000);
    const hours   = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById('days').textContent    = days;
    document.getElementById('hours').textContent   = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
